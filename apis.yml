aid: pluang
name: Pluang
description: 'Pluang is an Indonesian multi-asset investment and trading platform that lets retail
  users invest across a single app in US stocks and ETFs (fractional from $1), Indonesian stocks,
  cryptocurrencies with staking, mutual funds (Reksa Dana), physical gold and silver, options, and
  leveraged crypto futures. Features include Auto Invest dollar-cost averaging, the Pocket portfolio
  bundling tool, TradingView-powered charting, USD yield products, and the Aura AI recommendation
  assistant. Pluang operates under OJK and Bappebti regulatory oversight across its subsidiaries and
  reports 12M+ users. It exposes no public developer API; this profile captures its public web,
  legal, and security surface. Surfaced as an accel portfolio company and enriched by the API
  Evangelist pipeline.'
